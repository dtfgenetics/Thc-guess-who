name: Repair pinned Vite security release
on:
  push:
    branches:
      - work/game/vite-security-patch/20261020
    paths:
      - .github/workflows/repair-vite-security-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_digital-game/package-lock.json
      - name: Regenerate verified Vite dependency and exact lockfile
        working-directory: 03_digital-game
        run: npm install --save-dev --save-exact vite@8.2.4
      - name: Install and run full game qualification, including audit
        working-directory: 03_digital-game
        run: |
          npm ci
          npm run check
      - name: Commit only vetted dependency and lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_digital-game/package.json 03_digital-game/package-lock.json
          git diff --cached --quiet && { echo "No dependency changes"; exit 0; }
          git commit -m "fix(security): pin verified Vite 8.2.4 and regenerate lockfile"
          git push origin HEAD:work/game/vite-security-patch/20261020
