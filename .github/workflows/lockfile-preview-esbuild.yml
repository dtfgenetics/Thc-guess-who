name: Dependency lockfile preview (temporary)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute lockfile without running install scripts
        working-directory: 03_digital-game
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Output lockfile for reviewed source commit
        working-directory: 03_digital-game
        run: node -e "const fs=require('fs');console.log('LOCKFILE_JSON_BEGIN'+JSON.stringify(fs.readFileSync('package-lock.json','utf8'))+'LOCKFILE_JSON_END')"
