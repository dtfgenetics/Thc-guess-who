name: Digital Game Preview Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '03_digital-game/**'
      - '.github/workflows/pages-preview.yml'

permissions:
  contents: read

concurrency:
  group: who-took-it-preview-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_digital-game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 03_digital-game/.nvmrc
          cache: npm
          cache-dependency-path: 03_digital-game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full production quality check
        run: npm run check

      - name: Verify production route base
        run: |
          set -euo pipefail
          grep -Rqs '/games/who-took-it/' dist
          node scripts/verify-production-build.mjs

      - name: Upload production-like preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: who-took-it-preview-${{ github.sha }}
          path: 03_digital-game/dist
          if-no-files-found: error
          retention-days: 14
